<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DWMQY – Multi-Timeframe Context Model</title>
<meta name="description" content="Time-based structural awareness engine for institutional levels. Context, not signals.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#131722;
  --panel:#1e222d;
  --border:#2a2e39;
  --text:#d1d4dc;
  --muted:#787b86;
  --accent:#2962ff;
  --max:1100px;
  --radius:6px;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  line-height:1.55;
  font-size:15px;
}

.container{
  width:92%;
  max-width:var(--max);
  margin:0 auto;
}

header{
  padding:3.5rem 0 2.5rem;
  border-bottom:1px solid var(--border);
}

h1{
  font-size:28px;
  font-weight:600;
  letter-spacing:-0.01em;
}

.subtitle{
  color:var(--muted);
  margin-top:.6rem;
  max-width:720px;
}

.badge{
  display:inline-block;
  font-size:12px;
  color:var(--accent);
  margin-bottom:1rem;
}

section{
  padding:3rem 0;
  border-bottom:1px solid var(--border);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  transition:background .15s ease, border .15s ease;
}

.card:hover{
  border-color:var(--accent);
}

.card h3{
  font-size:15px;
  font-weight:500;
  margin-bottom:8px;
}

.card p{
  font-size:14px;
  color:var(--muted);
}

footer{
  padding:2rem 0;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}
</style>
</head>
